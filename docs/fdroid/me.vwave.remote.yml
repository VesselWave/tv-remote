# Draft fdroiddata recipe, to copy to metadata/me.vwave.remote.yml in fdroiddata.
# Follows fdroiddata's templates/build-react-native.yml. Expo modules already build from
# source (package.json `expo.autolinking.android.buildFromSource`), and the release Gradle
# properties come from plugins/with-wave-remote.cjs during `expo prebuild`.
Categories:
  - System
License: MIT
AuthorName: VesselWave
WebSite: https://remote.vwave.me
SourceCode: https://github.com/VesselWave/wave-remote
IssueTracker: https://github.com/VesselWave/wave-remote/issues
Changelog: https://github.com/VesselWave/wave-remote/blob/HEAD/CHANGELOG.md

AutoName: Wave Remote

RepoType: git
Repo: https://github.com/VesselWave/wave-remote.git

Builds:
  - versionName: '0.5'
    versionCode: 10011
    commit: v0.5
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - yes
    ndk: 27.1.12297006
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npx expo prebuild --platform android --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules
    gradleprops:
      - reactNativeArchitectures=arm64-v8a

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: VERSION_CODE|(\d+)|VERSION|(.+)
CurrentVersion: '0.5'
CurrentVersionCode: 10011
