Builds:
  - versionName: '0.6.1'
    versionCode: 10013
    commit: 07e9d975af8c45753870b99ecb7a84b767218896
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y --no-install-recommends curl xz-utils openjdk-17-jdk-headless
      - curl -fLo /tmp/node.tar.xz https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.xz
      - echo "cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local
      - rm /tmp/node.tar.xz
    init:
      - npm ci --ignore-scripts --no-audit --no-fund
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - node node_modules/expo/bin/cli prebuild --platform android --clean --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
    scandelete:
      - node_modules
    build:
      - cd android
      - LDFLAGS=-Wl,--build-id=none gradle assembleRelease -PreactNativeArchitectures=arm64-v8a
    ndk: 27.1.12297006

AllowedAPKSigningKeys: a2a5c53e76ebefe4c0c5b288904a813dc3d2a61e3802ac8066466167913ed69c

MaintainerNotes: |-
  Expo / React Native, following templates/build-react-native.yml. android/ is
  generated by `expo prebuild`, so Gradle runs from build:. Node.js is pinned to
  the upstream .node-version. Expo native modules are built from source
  (expo.autolinking.android.buildFromSource) and init: deletes their bundled
  local-maven-repo AARs. scanignore keeps the Linux hermesc and the local Maven
  declarations in three Gradle files. No Firebase, Play Services or expo-updates.

  usesCleartextTraffic: webOS serves the SSDP device description over plain HTTP,
  and TVs older than webOS 4 only offer ws:// on port 3000. Newer TVs use TLS,
  with the certificate pinned at first pairing.

  src/me/vwave/remote/Tv.java contains LG's signed client registration manifest,
  which the TV checks when pairing; see NOTICE.md upstream.

  Release APKs are signed with v2/v3 only and reproduce byte for byte; see
  docs/fdroid/README.md upstream.

