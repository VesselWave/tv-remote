plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'me.vwave.remote'
version = '1.0.0'

android {
  namespace 'me.vwave.remote.module'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  // Keep the tested Java protocol engine as the single source of truth.
  sourceSets {
    main {
      java.srcDirs += new File(projectDir, '../../../src')
    }
  }
}
